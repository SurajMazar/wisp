name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: cargo build -p wisp-core
      - run: pnpm validate
      - name: Build app bundle (ad-hoc signed)
        run: scripts/build/build-macos.sh
